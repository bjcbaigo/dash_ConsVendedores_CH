<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Scanner Productos</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg:      #1a1a2e;
      --bg2:     #16213e;
      --bg3:     #0f3460;
      --surface: #1e2a45;
      --sf2:     #243452;
      --border:  #2d4070;
      --accent:  #e94560;
      --acc2:    #0f9af0;
      --text:    #e8eaf6;
      --muted:   #8892b0;
      --good:    #00e676;
      --warn:    #ffd740;
      --bad:     #ff5252;
      --r:       14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--bg3), var(--bg2));
      padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .install-btn {
      background: var(--acc2); color: white; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: none;
    }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; padding: 16px; max-width: 480px; margin: 0 auto; width: 100%; }

    /* SCANNER CARD */
    .scanner-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
    .scanner-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .scanner-title { font-size: 15px; font-weight: 700; }
    .scan-toggle {
      background: var(--accent); color: white; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .scan-toggle.stop { background: #555; }

    /* VIEWFINDER */
    .viewfinder-wrap { position: relative; background: #000; display: none; min-height: 240px; }
    .viewfinder-wrap.open { display: block; }
    #reader { width: 100% !important; }
    #reader video { width: 100% !important; object-fit: cover; }

    /* SCAN ANIMATION */
    .scan-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center; }
    .scan-box { width: 200px; height: 200px; position: relative; }
    .scan-box::before, .scan-box::after {
      content: ''; position: absolute; width: 30px; height: 30px; border-color: var(--accent); border-style: solid;
    }
    .scan-box::before { top: 0; left: 0; border-width: 3px 0 0 3px; }
    .scan-box::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
    .scan-corners span { position: absolute; width: 30px; height: 30px; border-color: var(--accent); border-style: solid; }
    .scan-corners span:nth-child(1) { top: 0; right: 0; border-width: 3px 3px 0 0; }
    .scan-corners span:nth-child(2) { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
    .scan-line {
      position: absolute; left: 4px; right: 4px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scanline 2s linear infinite;
    }
    @keyframes scanline {
      0%  { top: 10%; opacity: 1; }
      90% { top: 85%; opacity: 1; }
      100%{ top: 85%; opacity: 0; }
    }

    /* MANUAL SEARCH */
    .manual-section { padding: 12px 16px; }
    .manual-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .manual-row { display: flex; flex-direction: column; gap: 8px; }
    .manual-input {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--text); outline: none;
    }
    .manual-input:focus { border-color: var(--acc2); }
    .manual-input::placeholder { color: var(--muted); }
    .search-btn { width: 100%; background: var(--acc2); color: white; border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }

    /* STATUS */
    .status-msg { padding: 10px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); text-align: center; display: none; }
    .status-msg.on { display: block; }
    .status-msg.found { color: var(--good); }
    .status-msg.notfound { color: var(--bad); }

    /* PRODUCT CARD */
    .product-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; margin-bottom: 16px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    .product-img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .product-body { padding: 16px; }
    .product-brand { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--acc2); margin-bottom: 4px; }
    .product-name  { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .product-model { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .features-list { list-style: none; margin-bottom: 16px; }
    .features-list li { font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; gap: 8px; }
    .features-list li::before { content: '✓'; color: var(--acc2); font-weight: 900; flex-shrink: 0; }
    .price-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .product-price { font-size: 26px; font-weight: 900; }
    .stock-badge { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; }
    .s-good { background: rgba(0,230,118,.15); color: var(--good); border: 1px solid rgba(0,230,118,.25); }
    .s-warn { background: rgba(255,215,64,.15); color: var(--warn); border: 1px solid rgba(255,215,64,.25); }
    .s-bad  { background: rgba(255,82,82,.15);  color: var(--bad);  border: 1px solid rgba(255,82,82,.25); }
    .product-id { font-size: 11px; color: var(--muted); margin-top: 10px; }

    /* NO RESULT */
    .no-result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; text-align: center; margin-bottom: 16px; animation: fadeIn .3s ease; }
    .nr-icon  { font-size: 40px; margin-bottom: 10px; }
    .nr-title { font-size: 16px; font-weight: 700; color: var(--bad); margin-bottom: 6px; }
    .nr-code  { font-size: 13px; color: var(--muted); }

    /* HISTORY */
    .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 16px; overflow: hidden; }
    .history-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .history-title { font-size: 14px; font-weight: 700; }
    .history-clear { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 8px; color: var(--muted); }
    .history-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.04); cursor: pointer; }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: var(--sf2); }
    .history-icon { font-size: 20px; flex-shrink: 0; }
    .h-name { font-size: 14px; font-weight: 600; }
    .h-meta { font-size: 12px; color: var(--muted); }
    .history-time { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
    .history-empty { padding: 20px 16px; text-align: center; color: var(--muted); font-size: 13px; }

    .footer { text-align: center; padding: 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>📷 Scanner Productos</h1>
    <div class="subtitle">Escaneá QR o código de barras</div>
  </div>
  <button class="install-btn" id="installBtn">📲 Instalar</button>
</div>

<div class="main">

  <div class="scanner-card">
    <div class="scanner-header">
      <span class="scanner-title">Cámara</span>
      <button class="scan-toggle" id="scanToggle" onclick="toggleScan()">▶ Iniciar cámara</button>
    </div>

    <div class="viewfinder-wrap" id="viewfinderWrap">
      <div id="reader"></div>
      <div class="scan-overlay">
        <div class="scan-box">
          <div class="scan-corners"><span></span><span></span></div>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>

    <div class="manual-section">
      <div class="manual-label">Búsqueda manual (código o nombre)</div>
      <div class="manual-row">
        <input id="manualInput" class="manual-input" type="text"
          placeholder="Ej: ART-001, iPhone o EAN…"
          onkeydown="if(event.key==='Enter') manualSearch()" />
        <button class="search-btn" onclick="manualSearch()">Buscar</button>
      </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div id="productResult"></div>

  <div class="history-card">
    <div class="history-header">
      <span class="history-title">Últimos escaneos</span>
      <button class="history-clear" onclick="clearHistory()">Limpiar</button>
    </div>
    <div id="historyList"><div class="history-empty">Sin escaneos recientes</div></div>
  </div>

</div>

<div class="footer">Scanner Productos PWA · Base local de 10 productos</div>

<script>
const PRODUCTOS = [
  { id:"ART-001", ean:"7798051234501", nombre:"Galaxy S24 Ultra",  marca:"Samsung",   modelo:"S24 Ultra 256GB",      caracteristicas:["6.8\" AMOLED","200MP cámara","5000mAh batería","S-Pen incluido"],          precio:299999, stock:12, foto:"https://picsum.photos/seed/samsung/300/200"    },
  { id:"ART-002", ean:"0194253413578", nombre:"iPhone 15 Pro",     marca:"Apple",     modelo:"A3102 128GB",           caracteristicas:["6.1\" Super Retina","48MP Triple cámara","USB-C","Chip A17 Pro"],          precio:349999, stock:8,  foto:"https://picsum.photos/seed/apple/300/200"      },
  { id:"ART-003", ean:"4548736142428", nombre:"WH-1000XM5",        marca:"Sony",      modelo:"WH-1000XM5/B",          caracteristicas:["ANC líder industria","30h batería","Bluetooth 5.2","Hi-Res Audio"],        precio:89999,  stock:25, foto:"https://picsum.photos/seed/sony/300/200"       },
  { id:"ART-004", ean:"8806098769599", nombre:"OLED 55\" 4K",      marca:"LG",        modelo:"OLED55C3PSA",           caracteristicas:["4K OLED 120Hz","Dolby Vision IQ","webOS 23","4x HDMI 2.1"],               precio:459999, stock:4,  foto:"https://picsum.photos/seed/lgtv/300/200"       },
  { id:"ART-005", ean:"5397184740040", nombre:"XPS 15 9530",       marca:"Dell",      modelo:"9530 Core i7",          caracteristicas:["15.6\" OLED Touch","Intel i7-13700H","16GB RAM DDR5","512GB NVMe"],        precio:529999, stock:6,  foto:"https://picsum.photos/seed/dell/300/200"       },
  { id:"ART-006", ean:"4549292195606", nombre:"EOS R50",           marca:"Canon",     modelo:"EOS R50 Kit 18-45mm",   caracteristicas:["24.2MP APS-C","Video 4K/30fps","WiFi Bluetooth","DIGIC X procesador"],    precio:189999, stock:9,  foto:"https://picsum.photos/seed/canon/300/200"      },
  { id:"ART-007", ean:"0889842640786", nombre:"Xbox Series X",     marca:"Microsoft", modelo:"1TB SSD",               caracteristicas:["4K 120fps","Ray Tracing","Quick Resume","Game Pass compatible"],          precio:219999, stock:3,  foto:"https://picsum.photos/seed/xbox/300/200"       },
  { id:"ART-008", ean:"5025155050941", nombre:"V15 Detect",        marca:"Dyson",     modelo:"V15 Detect Absolute",   caracteristicas:["230 AW succión","Láser detector polvo","Pantalla LCD","60min autonomía"], precio:159999, stock:17, foto:"https://picsum.photos/seed/dyson/300/200"      },
  { id:"ART-009", ean:"0840080500360", nombre:"Kindle Paperwhite", marca:"Amazon",    modelo:"11va Gen 8GB",          caracteristicas:["6.8\" 300ppi","Resistente al agua IPX8","Luz ajustable cálida","10 semanas batería"], precio:39999, stock:31, foto:"https://picsum.photos/seed/kindle/300/200" },
  { id:"ART-010", ean:"0194253412861", nombre:"Apple Watch S9",    marca:"Apple",     modelo:"Series 9 41mm GPS",     caracteristicas:["Always-On Retina","Chip S9 SiP","Crash Detection","Carbon neutral"],      precio:179999, stock:14, foto:"https://picsum.photos/seed/applewatch/300/200" },
];

let scannerRunning = false;
let html5QrCode = null;
let history = [];

function lookupProduct(raw) {
  raw = String(raw||'').trim();
  if (raw.startsWith('{')) {
    try {
      const obj = JSON.parse(raw);
      const r = PRODUCTOS.find(p => p.id === obj.id);
      if (r) return r;
    } catch(_) {}
  }
  const q = raw.toLowerCase();
  return PRODUCTOS.find(p => p.id.toLowerCase() === q) ||
         PRODUCTOS.find(p => p.ean === raw) ||
         PRODUCTOS.find(p => p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q) || p.modelo.toLowerCase().includes(q)) ||
         null;
}

function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderProduct(p) {
  const sc = p.stock < 5 ? 's-bad' : p.stock < 20 ? 's-warn' : 's-good';
  const sl = `Stock: ${p.stock}${p.stock < 5 ? ' ⚠️' : ''}`;
  document.getElementById('productResult').innerHTML = `
    <div class="product-card">
      <img class="product-img" src="${esc(p.foto)}" alt="${esc(p.nombre)}" loading="lazy"
           onerror="this.src='https://picsum.photos/seed/${p.id}/300/200'" />
      <div class="product-body">
        <div class="product-brand">${esc(p.marca)}</div>
        <div class="product-name">${esc(p.nombre)}</div>
        <div class="product-model">${esc(p.modelo)}</div>
        <ul class="features-list">${p.caracteristicas.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
        <div class="price-row">
          <div class="product-price">$${Number(p.precio).toLocaleString('es-AR')}</div>
          <div class="stock-badge ${sc}">${sl}</div>
        </div>
        <div class="product-id">ID: ${esc(p.id)} &nbsp;·&nbsp; EAN: ${esc(p.ean)}</div>
      </div>
    </div>`;
}

function renderNoResult(code) {
  document.getElementById('productResult').innerHTML = `
    <div class="no-result">
      <div class="nr-icon">🔍</div>
      <div class="nr-title">Producto no encontrado</div>
      <div class="nr-code">Código: <strong>${esc(code)}</strong></div>
    </div>`;
}

function setStatus(type, msg) {
  const el = document.getElementById('statusMsg');
  el.className = `status-msg on ${type}`;
  el.textContent = msg;
}

function handleCode(code) {
  code = String(code||'').trim();
  if (!code) return;
  const p = lookupProduct(code);
  setStatus(p ? 'found' : 'notfound', p ? `✓ ${p.nombre}` : `No encontrado: ${code}`);
  if (p) renderProduct(p);
  else renderNoResult(code);
  addHistory(p, code);
  if (scannerRunning) stopScan();
}

function manualSearch() {
  const v = document.getElementById('manualInput').value.trim();
  if (v) handleCode(v);
}

async function toggleScan() {
  scannerRunning ? stopScan() : await startScan();
}

async function startScan() {
  const btn = document.getElementById('scanToggle');
  const wrap = document.getElementById('viewfinderWrap');
  btn.textContent = '⏹ Detener';
  btn.classList.add('stop');
  wrap.classList.add('open');
  try {
    html5QrCode = new Html5Qrcode('reader');
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 200, height: 200 }, aspectRatio: 1.5 },
      (text) => handleCode(text),
      () => {}
    );
    scannerRunning = true;
  } catch(e) {
    wrap.classList.remove('open');
    btn.textContent = '▶ Iniciar cámara';
    btn.classList.remove('stop');
    setStatus('notfound', 'No se pudo acceder a la cámara. Usá búsqueda manual.');
  }
}

async function stopScan() {
  const btn = document.getElementById('scanToggle');
  const wrap = document.getElementById('viewfinderWrap');
  btn.textContent = '▶ Iniciar cámara';
  btn.classList.remove('stop');
  wrap.classList.remove('open');
  scannerRunning = false;
  if (html5QrCode) {
    try { await html5QrCode.stop(); } catch(_) {}
    try { html5QrCode.clear(); } catch(_) {}
    html5QrCode = null;
  }
}

function addHistory(product, code) {
  history.unshift({ product, code, time: new Date() });
  if (history.length > 5) history.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) { el.innerHTML = '<div class="history-empty">Sin escaneos recientes</div>'; return; }
  el.innerHTML = history.map((e, i) => {
    const p = e.product;
    const name = p ? p.nombre : 'No encontrado';
    const meta = p ? `${p.marca} · $${Number(p.precio).toLocaleString('es-AR')}` : e.code;
    const t = e.time.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    return `<div class="history-item" onclick="reloadHist(${i})">
      <span class="history-icon">${p ? '✅' : '❌'}</span>
      <div><div class="h-name">${esc(name)}</div><div class="h-meta">${esc(meta)}</div></div>
      <span class="history-time">${t}</span>
    </div>`;
  }).join('');
}

function reloadHist(i) {
  const e = history[i];
  if (e.product) renderProduct(e.product);
  else renderNoResult(e.code);
}

function clearHistory() {
  history = [];
  renderHistory();
}

// PWA install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
