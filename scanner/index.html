<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Scanner Productos</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #2f81f7;
      --accent2: #1f6feb;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 24px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0d1117, #161b22);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-icon { font-size: 26px; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .header-nav { margin-left: auto; }
    .btn-home {
      background: var(--panel2); border: 1px solid var(--border);
      color: var(--muted); padding: 8px 12px; border-radius: 10px;
      font-size: 13px; text-decoration: none; display: inline-block;
    }

    /* Main content */
    .main { max-width: 520px; margin: 0 auto; padding: 16px; }

    /* Card */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 12px;
    }

    /* Scanner area */
    .scanner-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 1 / 1;
      max-height: 300px;
    }
    #reader {
      width: 100% !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }
    /* Override html5-qrcode styles */
    #reader img { display: none !important; }
    #reader__scan_region { border: none !important; }
    #reader__dashboard { display: none !important; }

    .scan-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .scan-frame {
      width: 180px; height: 180px;
      border: 2px solid rgba(47,129,247,.7);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
      position: relative;
    }
    .scan-frame::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scanline 2s ease-in-out infinite;
    }
    @keyframes scanline {
      0%, 100% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      0% { top: 0; }
      50% { top: calc(100% - 3px); }
    }
    .scan-corner {
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--accent);
      border-style: solid;
    }
    .scan-corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scan-corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scan-corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Controls */
    .scanner-controls { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      border: none; border-radius: 10px; padding: 12px 16px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 8px; justify-content: center;
      transition: opacity .15s;
    }
    .btn:active { opacity: .75; }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-stop { background: var(--bad); color: #fff; flex: 1; }
    .btn-secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }

    /* Status */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 10px;
      background: var(--panel2); border: 1px solid var(--border);
      font-size: 13px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .status-dot.active { background: var(--good); animation: pulse 1.5s infinite; }
    .status-dot.error { background: var(--bad); }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: .4; }
    }

    /* Manual search */
    .search-row { display: flex; gap: 8px; }
    .search-input {
      flex: 1; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; font-size: 16px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    /* Product card */
    .product-card { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .product-photo {
      width: 100%; aspect-ratio: 3/2; object-fit: cover;
      border-radius: 10px; margin-bottom: 14px;
      background: var(--panel2);
    }
    .product-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .product-brand { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .product-name { font-size: 20px; font-weight: 800; margin-top: 4px; line-height: 1.2; }
    .product-model { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .stock-badge {
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800;
      white-space: nowrap; flex-shrink: 0;
    }
    .stock-good { background: rgba(63,185,80,.15); color: #56d364; border: 1px solid rgba(63,185,80,.3); }
    .stock-warn { background: rgba(210,153,34,.15); color: #e3b341; border: 1px solid rgba(210,153,34,.3); }
    .stock-bad  { background: rgba(248,81,73,.15);  color: #ff7b72; border: 1px solid rgba(248,81,73,.3); }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
    .info-box {
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }
    .info-box .lab { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .info-box .val { font-size: 22px; font-weight: 800; margin-top: 6px; }
    .info-box .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .price-val { color: var(--accent); }

    .features-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .features-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .features-list li {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 14px; line-height: 1.4;
    }
    .features-list li::before {
      content: '✓'; color: var(--good); font-weight: 800;
      font-size: 12px; margin-top: 2px; flex-shrink: 0;
    }

    .id-row {
      display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
    }
    .chip {
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px;
      font-size: 11px; color: var(--muted); font-family: monospace;
    }

    /* History */
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; cursor: pointer;
      transition: border-color .15s;
    }
    .history-item:hover { border-color: var(--accent); }
    .history-icon { font-size: 20px; }
    .history-name { font-size: 14px; font-weight: 700; }
    .history-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .history-time { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

    /* Not found */
    .not-found { text-align: center; padding: 24px 0; color: var(--muted); }
    .not-found .icon { font-size: 48px; margin-bottom: 10px; }
    .not-found p { font-size: 14px; }

    /* Empty state */
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 16px 0; }

    @media (min-width: 480px) {
      .scanner-wrap { max-height: 360px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">📷</div>
  <div>
    <h1>Scanner Productos</h1>
    <p>Lector QR / EAN con base local</p>
  </div>
  <div class="header-nav">
    <a class="btn-home" href="../index.html">← Inicio</a>
  </div>
</div>

<div class="main">

  <!-- Scanner -->
  <div class="card">
    <div class="card-title">📷 Cámara</div>
    <div class="scanner-wrap">
      <div id="reader"></div>
      <div class="scan-overlay" id="scanOverlay">
        <div class="scan-frame">
          <div class="scan-corner tl"></div>
          <div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div>
          <div class="scan-corner br"></div>
        </div>
      </div>
    </div>
    <div class="scanner-controls">
      <button class="btn btn-primary" id="btnStart">▶ Iniciar cámara</button>
      <button class="btn btn-stop" id="btnStop" style="display:none">⏹ Detener</button>
    </div>
    <div class="status-bar" style="margin-top:10px">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Presioná "Iniciar cámara" para escanear</span>
    </div>
  </div>

  <!-- Manual search -->
  <div class="card">
    <div class="card-title">🔍 Búsqueda manual</div>
    <div class="search-row">
      <input class="search-input" id="searchInput" type="text"
        placeholder="Código ART-001 o EAN..." autocomplete="off" />
      <button class="btn btn-secondary" id="btnSearch">Buscar</button>
    </div>
  </div>

  <!-- Product result -->
  <div id="productSection" style="display:none">
    <div class="card product-card" id="productCard"><!-- filled by JS --></div>
  </div>

  <!-- History -->
  <div class="card" id="historySection">
    <div class="card-title">🕐 Últimas consultas</div>
    <div id="historyList" class="empty">Aún no hay escaneos recientes.</div>
  </div>

</div>

// ── Utilidades ────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

function fmt(n) {
  return Number(n || 0).toLocaleString('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
}

function findProduct(raw) {
  const q = (raw || '').trim();
  if (!q) return null;
  // try id exact
  let p = PRODUCTOS.find(x => x.id.toLowerCase() === q.toLowerCase());
  if (p) return p;
  // try ean exact
  p = PRODUCTOS.find(x => x.ean === q);
  if (p) return p;
  // try json with id field
  try {
    const obj = JSON.parse(q);
    if (obj.id) {
      p = PRODUCTOS.find(x => x.id === obj.id);
      if (p) return p;
    }
    if (obj.ean) {
      p = PRODUCTOS.find(x => x.ean === obj.ean);
      if (p) return p;
    }
  } catch (_) {}
  // partial match by name
  p = PRODUCTOS.find(x =>
    x.nombre.toLowerCase().includes(q.toLowerCase()) ||
    x.id.toLowerCase().includes(q.toLowerCase())
  );
  return p || null;
}

function stockClass(s) {
  if (s >= 20) return 'stock-good';
  if (s >= 5)  return 'stock-warn';
  return 'stock-bad';
}
function stockLabel(s) {
  if (s >= 20) return `✅ Stock OK (${s} u.)`;
  if (s >= 5)  return `⚠️ Stock bajo (${s} u.)`;
  if (s > 0)   return `🔴 Pocas unidades (${s} u.)`;
  return '❌ Sin stock';
}

// ── Historial ─────────────────────────────────────────────────────────────────
let history = [];

function addHistory(product) {
  history = [product, ...history.filter(x => x.id !== product.id)].slice(0, 5);
  renderHistory();
}

function renderHistory() {
  const el = $('historyList');
  if (!history.length) {
    el.innerHTML = '<div class="empty">Aún no hay escaneos recientes.</div>';
    return;
  }
  el.innerHTML = '';
  el.className = 'history-list';
  history.forEach(p => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="history-icon">📦</div>
      <div>
        <div class="history-name">${p.nombre}</div>
        <div class="history-meta">${p.marca} · ${p.id}</div>
      </div>
      <div class="history-time">${fmt(p.precio)}</div>
    `;
    div.addEventListener('click', () => showProduct(p));
    el.appendChild(div);
  });
}

// ── Mostrar producto ──────────────────────────────────────────────────────────
function showProduct(p) {
  const sc = stockClass(p.stock);
  const sl = stockLabel(p.stock);

  $('productCard').innerHTML = `
    <img class="product-photo" src="${p.foto}" alt="${p.nombre}"
      onerror="this.src='https://via.placeholder.com/400x267/1c2128/7d8590?text=Sin+foto'" />
    <div class="product-header">
      <div>
        <div class="product-brand">${p.marca}</div>
        <div class="product-name">${p.nombre}</div>
        <div class="product-model">${p.modelo}</div>
      </div>
      <span class="stock-badge ${sc}">${sl}</span>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="lab">Precio</div>
        <div class="val price-val">${fmt(p.precio)}</div>
        <div class="sub">Precio de lista</div>
      </div>
      <div class="info-box">
        <div class="lab">Stock</div>
        <div class="val">${p.stock}</div>
        <div class="sub">Unidades disponibles</div>
      </div>
    </div>

    <div class="features-title">Características</div>
    <ul class="features-list">
      ${p.caracteristicas.map(c => `<li>${c}</li>`).join('')}
    </ul>

    <div class="id-row">
      <span class="chip">ID: ${p.id}</span>
      <span class="chip">EAN: ${p.ean}</span>
    </div>
  `;

  $('productSection').style.display = 'block';
  $('productSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  addHistory(p);
}

function showNotFound(raw) {
  $('productCard').innerHTML = `
    <div class="not-found">
      <div class="icon">🔍</div>
      <p><strong>No encontrado</strong></p>
      <p style="margin-top:6px">Código: <code>${raw}</code></p>
      <p style="margin-top:4px; font-size:13px">Verificá el código e intentá de nuevo.</p>
    </div>
  `;
  $('productSection').style.display = 'block';
  $('productSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Buscar ────────────────────────────────────────────────────────────────────
function doSearch(raw) {
  const p = findProduct(raw);
  if (p) showProduct(p);
  else showNotFound(raw);
}

// ── Scanner ───────────────────────────────────────────────────────────────────
let scanner = null;
let scanning = false;

function setStatus(text, state) {
  $('statusText').textContent = text;
  const dot = $('statusDot');
  dot.className = 'status-dot' + (state === 'active' ? ' active' : state === 'error' ? ' error' : '');
}

async function startScanner() {
  if (scanning) return;
  setStatus('Iniciando cámara…', '');
  $('btnStart').style.display = 'none';
  $('btnStop').style.display = 'flex';

  try {
    scanner = new Html5Qrcode('reader');
    const config = {
      fps: 12,
      qrbox: { width: 200, height: 200 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
      ]
    };

    await scanner.start(
      { facingMode: 'environment' },
      config,
      (decoded) => {
        setStatus('✅ Código leído: ' + decoded.slice(0, 40), 'active');
        stopScanner();
        doSearch(decoded);
      },
      () => { /* ignore scan errors */ }
    );

    scanning = true;
    setStatus('Cámara activa — apuntá al código QR o EAN', 'active');
  } catch (err) {
    setStatus('Error: ' + (err.message || err), 'error');
    $('btnStart').style.display = 'flex';
    $('btnStop').style.display = 'none';
  }
}

async function stopScanner() {
  if (!scanner) return;
  try {
    await scanner.stop();
    scanner.clear();
  } catch (_) {}
  scanner = null;
  scanning = false;
  $('btnStart').style.display = 'flex';
  $('btnStop').style.display = 'none';
  setStatus('Cámara detenida', '');
}

// ── Event listeners ───────────────────────────────────────────────────────────
$('btnStart').addEventListener('click', startScanner);
$('btnStop').addEventListener('click', stopScanner);

$('btnSearch').addEventListener('click', () => {
  const v = $('searchInput').value.trim();
  if (v) { doSearch(v); $('searchInput').value = ''; }
});

$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = $('searchInput').value.trim();
    if (v) { doSearch(v); $('searchInput').value = ''; }
  }
});

// ── Service Worker ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
