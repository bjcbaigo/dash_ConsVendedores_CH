<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Etiquetas con QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --blue: #1a56db;
      --blue-dark: #1e429f;
      --blue-light: #ebf5ff;
      --blue-mid: #3f83f8;
      --text: #111928;
      --muted: #6b7280;
      --border: #d1d5db;
      --bg: #f3f4f6;
      --white: #ffffff;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* TOP BAR */
    .topbar {
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: white; padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.18); position: sticky; top: 0; z-index: 100;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: .4px; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }

    /* BUTTONS */
    .btn {
      border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary   { background: var(--blue); color: white; }
    .btn-success   { background: var(--success); color: white; }
    .btn-danger-ol { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-outline   { background: white; color: var(--blue); border: 1px solid var(--blue); }
    .btn-white     { background: white; color: var(--blue-dark); font-weight: 700; }
    .btn-sm        { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

    /* LAYOUT */
    .layout {
      display: grid; grid-template-columns: 1fr 420px;
      height: calc(100vh - 60px); overflow: hidden;
    }
    .panel { overflow-y: auto; padding: 20px; }
    .panel-left  { background: var(--white); border-right: 1px solid var(--border); }
    .panel-right { background: var(--bg); }

    /* SECTION HEADER */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-title  { font-size: 16px; font-weight: 700; color: var(--blue-dark); }

    /* SIZE SELECTOR */
    .size-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .size-row label { font-size: 13px; color: var(--muted); font-weight: 600; }
    .size-btn {
      padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-weight: 600; background: white; cursor: pointer; transition: all .15s;
    }
    .size-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

    /* TABLE */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--blue-light); color: var(--blue-dark);
      padding: 10px 8px; text-align: left; font-weight: 700;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody tr:nth-child(even) { background: #f9fafb; }
    tbody tr:hover { background: #eff6ff; }
    tbody td { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tbody td input[type="text"],
    tbody td input[type="number"] {
      width: 100%; border: 1px solid transparent; border-radius: 5px;
      padding: 4px 6px; font-size: 13px; background: transparent; outline: none; transition: border .15s;
    }
    tbody td input:focus { border-color: var(--blue-mid); background: white; }
    .col-check  { width: 36px; text-align: center; }
    .col-action { width: 60px; text-align: center; }

    .table-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; flex-wrap: wrap; gap: 8px;
    }
    .selected-info { font-size: 13px; color: var(--muted); }

    /* LABELS PANEL */
    .labels-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .labels-count  { font-size: 13px; color: var(--muted); }
    .labels-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
    .labels-grid.size-small  { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .labels-grid.size-large  { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

    /* SINGLE LABEL */
    .label-card {
      background: white; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 8px 8px; display: flex; flex-direction: column;
      align-items: center; gap: 5px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .label-card .qr-wrap canvas { display: block; }
    .lbl-marca  { font-size: 9px;  color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    .lbl-code   { font-size: 11px; font-weight: 800; color: var(--blue-dark); }
    .lbl-desc   {
      font-size: 10px; color: var(--text); text-align: center; line-height: 1.3;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      max-width: 100%;
    }
    .lbl-price  { font-size: 13px; font-weight: 800; color: var(--blue); }

    /* SIZE VARIANTS */
    .size-small .label-card { padding: 6px 5px 5px; gap: 3px; }
    .size-small .lbl-price  { font-size: 11px; }
    .size-large .label-card { padding: 14px 12px 10px; gap: 8px; }
    .size-large .lbl-code   { font-size: 13px; }
    .size-large .lbl-desc   { font-size: 12px; }
    .size-large .lbl-price  { font-size: 16px; }
    .size-large .lbl-marca  { font-size: 11px; }

    .empty-labels { grid-column: 1/-1; text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: white;
      padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 9999;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* PRINT */
    @media print {
      .topbar, .panel-left { display: none !important; }
      body { background: white; }
      .layout { display: block; height: auto; overflow: visible; }
      .panel-right { padding: 4mm; overflow: visible; }
      .labels-header { display: none !important; }
      .labels-grid { gap: 4mm !important; }
      .labels-grid.size-small  { grid-template-columns: repeat(5, 1fr) !important; }
      .labels-grid.size-medium { grid-template-columns: repeat(4, 1fr) !important; }
      .labels-grid.size-large  { grid-template-columns: repeat(3, 1fr) !important; }
      .label-card {
        border: 1px solid #bbb !important; border-radius: 4px !important;
        break-inside: avoid; page-break-inside: avoid; box-shadow: none !important;
      }
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .panel { overflow-y: visible; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>🏷️ Generador de Etiquetas con QR</h1>
  <div class="topbar-actions">
    <button class="btn btn-white" onclick="printLabels()">🖨️ Imprimir etiquetas</button>
  </div>
</div>

<div class="layout">
  <!-- LEFT: Product table -->
  <div class="panel panel-left">
    <div class="section-header">
      <span class="section-title">Productos</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="addRow()">+ Agregar</button>
        <button class="btn btn-primary btn-sm" onclick="generateLabels()">⚡ Generar etiquetas</button>
      </div>
    </div>

    <div class="size-row">
      <label>Tamaño:</label>
      <button class="size-btn" id="sz-small"  onclick="setSize('small')">Pequeño</button>
      <button class="size-btn active" id="sz-medium" onclick="setSize('medium')">Mediano</button>
      <button class="size-btn" id="sz-large"  onclick="setSize('large')">Grande</button>
    </div>

    <div class="table-wrap">
      <table id="productTable">
        <thead>
          <tr>
            <th class="col-check">
              <input type="checkbox" id="checkAll" title="Sel. todo" onclick="toggleAll(this)" />
            </th>
            <th>Código</th>
            <th>Descripción</th>
            <th>Marca</th>
            <th>Precio</th>
            <th>Stock</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="table-footer">
      <span class="selected-info" id="selectedInfo">0 seleccionados</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm"   onclick="selectAll()">Sel. todo</button>
        <button class="btn btn-danger-ol btn-sm" onclick="deleteSelected()">Eliminar sel.</button>
        <button class="btn btn-primary btn-sm"   onclick="generateLabels()">⚡ Generar</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Label previews -->
  <div class="panel panel-right">
    <div class="labels-header">
      <span class="section-title">Vista previa</span>
      <span class="labels-count" id="labelsCount">0 etiquetas</span>
    </div>
    <div class="labels-grid size-medium" id="labelsGrid">
      <div class="empty-labels">Seleccioná productos y presioná "Generar etiquetas"</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- DATA ----
let products = [
  { id: 1,  codigo: 'ART-001', descripcion: 'Galaxy S24 Ultra 256GB',     marca: 'Samsung',   precio: 299999, stock: 12 },
  { id: 2,  codigo: 'ART-002', descripcion: 'iPhone 15 Pro 128GB',         marca: 'Apple',     precio: 349999, stock: 8  },
  { id: 3,  codigo: 'ART-003', descripcion: 'WH-1000XM5 Auriculares',      marca: 'Sony',      precio: 89999,  stock: 25 },
  { id: 4,  codigo: 'ART-004', descripcion: 'OLED 55" 4K C3PSA',           marca: 'LG',        precio: 459999, stock: 4  },
  { id: 5,  codigo: 'ART-005', descripcion: 'XPS 15 9530 Core i7',         marca: 'Dell',      precio: 529999, stock: 6  },
  { id: 6,  codigo: 'ART-006', descripcion: 'EOS R50 Kit 18-45mm',         marca: 'Canon',     precio: 189999, stock: 9  },
  { id: 7,  codigo: 'ART-007', descripcion: 'Xbox Series X 1TB SSD',       marca: 'Microsoft', precio: 219999, stock: 3  },
  { id: 8,  codigo: 'ART-008', descripcion: 'V15 Detect Absolute',         marca: 'Dyson',     precio: 159999, stock: 17 },
  { id: 9,  codigo: 'ART-009', descripcion: 'Kindle Paperwhite 11va Gen',  marca: 'Amazon',    precio: 39999,  stock: 31 },
  { id: 10, codigo: 'ART-010', descripcion: 'Apple Watch Series 9 41mm',   marca: 'Apple',     precio: 179999, stock: 14 },
];
let nextId = 11;
let selectedIds = new Set();
let currentSize = 'medium';

// ---- TABLE ----
function renderTable() {
  document.getElementById('tableBody').innerHTML = products.map(p => `
    <tr data-id="${p.id}">
      <td class="col-check">
        <input type="checkbox" class="row-check" ${selectedIds.has(p.id) ? 'checked' : ''}
          onchange="toggleRow(${p.id}, this.checked)" />
      </td>
      <td><input type="text"   value="${esc(p.codigo)}"      onchange="upd(${p.id},'codigo',this.value)"      placeholder="Código" /></td>
      <td><input type="text"   value="${esc(p.descripcion)}" onchange="upd(${p.id},'descripcion',this.value)" placeholder="Descripción" /></td>
      <td><input type="text"   value="${esc(p.marca)}"       onchange="upd(${p.id},'marca',this.value)"       placeholder="Marca" /></td>
      <td><input type="number" value="${p.precio}"           onchange="upd(${p.id},'precio',this.value)"      placeholder="Precio" min="0" /></td>
      <td><input type="number" value="${p.stock}"            onchange="upd(${p.id},'stock',this.value)"       placeholder="Stock"  min="0" /></td>
      <td class="col-action">
        <button class="btn btn-danger-ol btn-sm" onclick="deleteRow(${p.id})">✕</button>
      </td>
    </tr>
  `).join('');
  updateInfo();
}

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function upd(id, field, value) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  p[field] = (field === 'precio' || field === 'stock') ? (parseFloat(value) || 0) : value;
}

function addRow() {
  const n = nextId++;
  products.push({ id: n, codigo: `ART-${String(n).padStart(3,'0')}`, descripcion: '', marca: '', precio: 0, stock: 0 });
  renderTable();
  showToast('Fila agregada');
}

function deleteRow(id) {
  products = products.filter(p => p.id !== id);
  selectedIds.delete(id);
  renderTable();
}

function deleteSelected() {
  if (!selectedIds.size) { showToast('No hay seleccionados'); return; }
  products = products.filter(p => !selectedIds.has(p.id));
  selectedIds.clear();
  renderTable();
  clearGrid();
  showToast('Eliminados');
}

function toggleRow(id, checked) {
  checked ? selectedIds.add(id) : selectedIds.delete(id);
  updateInfo();
}

function toggleAll(el) {
  if (el.checked) products.forEach(p => selectedIds.add(p.id));
  else selectedIds.clear();
  renderTable();
}

function selectAll() {
  products.forEach(p => selectedIds.add(p.id));
  renderTable();
}

function updateInfo() {
  document.getElementById('selectedInfo').textContent = `${selectedIds.size} seleccionados`;
}

function clearGrid() {
  document.getElementById('labelsGrid').innerHTML = '<div class="empty-labels">Sin etiquetas para mostrar.</div>';
  document.getElementById('labelsCount').textContent = '0 etiquetas';
}

// ---- SIZE ----
function setSize(s) {
  currentSize = s;
  ['small','medium','large'].forEach(x =>
    document.getElementById('sz-'+x).classList.toggle('active', x === s)
  );
  const grid = document.getElementById('labelsGrid');
  grid.className = `labels-grid size-${s}`;
  if (grid.querySelector('.label-card')) generateLabels();
}

function qrPx(size) { return { small: 80, medium: 110, large: 140 }[size] || 110; }

// ---- GENERATE ----
async function generateLabels() {
  const list = selectedIds.size ? products.filter(p => selectedIds.has(p.id)) : products;
  if (!list.length) { showToast('No hay productos para generar'); return; }

  const grid = document.getElementById('labelsGrid');
  grid.className = `labels-grid size-${currentSize}`;
  grid.innerHTML = '';
  document.getElementById('labelsCount').textContent = `${list.length} etiqueta${list.length !== 1 ? 's' : ''}`;

  for (const p of list) {
    const qrData = JSON.stringify({ id: p.codigo, desc: p.descripcion, marca: p.marca, precio: p.precio });

    const card = document.createElement('div');
    card.className = 'label-card';

    const qrWrap = document.createElement('div');
    qrWrap.className = 'qr-wrap';
    card.appendChild(qrWrap);

    card.insertAdjacentHTML('beforeend', `
      <div class="lbl-marca">${esc(p.marca)}</div>
      <div class="lbl-code">${esc(p.codigo)}</div>
      <div class="lbl-desc">${esc(p.descripcion)}</div>
      <div class="lbl-price">$${Number(p.precio).toLocaleString('es-AR')}</div>
    `);

    grid.appendChild(card);

    try {
      const canvas = document.createElement('canvas');
      qrWrap.appendChild(canvas);
      await QRCode.toCanvas(canvas, qrData, { width: qrPx(currentSize), margin: 1, color: { dark: '#111928', light: '#ffffff' } });
    } catch(e) {
      const px = qrPx(currentSize);
      qrWrap.innerHTML = `<div style="width:${px}px;height:${px}px;background:#fee2e2;display:flex;align-items:center;justify-content:center;font-size:10px;color:#ef4444;border-radius:4px;">QR error</div>`;
    }
  }
}

// ---- PRINT ----
function printLabels() {
  if (!document.getElementById('labelsGrid').querySelector('.label-card')) {
    showToast('Primero generá las etiquetas');
    return;
  }
  window.print();
}

// ---- TOAST ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---- INIT ----
renderTable();
</script>
</body>
</html>
